name: Fabric 1.21.1 build
on:
  push:
    branches: ['codex/pages-of-atlas-1.21.1']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # One-time transport workaround. Removed after publishing this exact checksum file.
      - name: Publish verified checksum inventory
        if: hashFiles('.github/verification-bootstrap.b64') != ''
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(Path('.github/verification-bootstrap.b64').read_text()))
          assert hashlib.sha256(data).hexdigest() == '999996794014a1814e9c25a98354b5b2bddc3f40a5fd7a78c00c292a20ce5b16'
          Path('gradle/verification-metadata.xml').write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/verification-metadata.xml
          git rm .github/verification-bootstrap.b64
          git commit -m 'Record exact verified dependency inventory'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned offline GLSL compiler
        run: |
          curl -fL --retry 2 https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.zip -o "$RUNNER_TEMP/glslang.zip"
          echo "a3fc4f083b1793eb53e55fa3577ac9649ffbe0340715e30d116290fb5382393f  $RUNNER_TEMP/glslang.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/glslang.zip" -d "$RUNNER_TEMP/glslang"
          chmod +x "$RUNNER_TEMP/glslang/bin/glslang"
          echo "GLSLANG_VALIDATOR=$RUNNER_TEMP/glslang/bin/glslang" >> "$GITHUB_ENV"
      - name: Fetch pinned public shader test inputs
        run: python3 tools/fetch_shader_fixtures.py
      - name: Verify wrapper, compile, remap and test
        run: |
          echo '55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          bash gradlew build --no-daemon --console=plain
      - name: Validate production JAR and synthetic generator
        run: |
          python3 tools/validate_artifact.py
          python3 tools/test_generator.py
          python3 tools/generate_test_pack.py
      - name: Upload experimental remapped build and checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-of-atlas-1.21.1-experimental-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/*backport.2*.jar
            build/libs/*backport.2*.sha256
            build/reports/tests/test/**
            build/test-results/test/*.xml
            build/reports/package-validation.json
            build/test-packs/*backport2.zip
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-failure-${{ github.sha }}
          retention-days: 7
          path: |
            build/reports/**
            build/test-results/**
