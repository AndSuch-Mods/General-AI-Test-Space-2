plugins {
    id 'fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'pages-of-atlas' }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        pagesofatlas {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:sodium:${sodium_version}"
    modImplementation "maven.modrinth:iris:${iris_version}"
    modRuntimeOnly "maven.modrinth:continuity:${continuity_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jar { from('LICENSE') }
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
test {
    useJUnitPlatform()
    if (System.getenv('GLSLANG_VALIDATOR')) systemProperty 'poa.glslang', System.getenv('GLSLANG_VALIDATOR')
}
